databases:
  - name: kaizen-reporting-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "15"

services:
  - type: web
    name: kaizen-reporting-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: TAUX_CFA_EUR
        value: "655.957"
      - key: DATABASE_URL
        fromDatabase:
          name: kaizen-reporting-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://kaizen-reporting.vercel.app
